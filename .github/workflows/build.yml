name: Build APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEWDREAM_KEYSTORE_BASE64: ${{ secrets.NEWDREAM_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from secrets
        if: env.NEWDREAM_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.NEWDREAM_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/newdream-release.p12

      - name: Write keystore.properties from secrets
        if: env.NEWDREAM_KEYSTORE_BASE64 != ''
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/newdream-release.p12
          storePassword=${{ secrets.NEWDREAM_STORE_PASSWORD }}
          keyAlias=newdream
          keyPassword=${{ secrets.NEWDREAM_KEY_PASSWORD }}
          storeType=pkcs12
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NewDream-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK (signed if secrets present)
        uses: actions/upload-artifact@v4
        with:
          name: NewDream-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew lint
